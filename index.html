<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  
  <title>Frontend Mentor | Blog preview card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

  <div class="card-container">
    <div class="card">
      <img src="/assets/images/illustration-article.svg" alt="Web 3.0 image" class="card-image">
      <div class="card-content">
        <div class="learning heartbeat">
          Learning
        </div>
        <div class="published">
          Published 21 Dec 2023
        </div>
        <h1 class="card-title">HTML & CSS foundations</h1>
        <p class="card-text">These languages are the backbone of every website, defining structure, content, and presentation.</p>
      </div>
      <div class="card-author">
        <img src="/assets/images/image-avatar.webp" alt="Michelle Avatar" class="author-avatar">
        <span class="author-name"> Greg Hooper</span>  
      </div>
    </div>

  </div>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://www.linkedin.com/in/karl-davis-b9ba0b107/®" target="_blank">Karl Davis</a>.
  </footer>
</body>
</html>
